[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-llm-core"
version = "0.1.0"
description = "Durable, policy-controlled multi-provider LLM workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
multi-llm = "application.cli:main"

[tool.setuptools.packages.find]
include = ["application*"]

[tool.setuptools.package-data]
application = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: requires an available Linux Docker daemon and prebuilt sandbox image"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
